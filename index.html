<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="theme-color" content="#f3f5f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Polako">
<title>Polako</title>
<meta name="description" content="Polako — personal Serbian words and phrases">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ============================================================
   Polako page. Structure is fixed:
   header (brand · tabs · Lat|Ћир · theme) + summary line (coverage, due, streak)
   main   (one tab: Тренажёр · Словарь · Ситуации · Мои тексты · Статистика · Колода)
   Colours are tokens with light and dark values; chart series use the validated
   categorical palette (--c1 blue, --c2 orange) and a one-hue sequential blue ramp.
   ============================================================ */
:root{
  --bg:#f3f5f4;--surface:#fff;--surface-2:#f6f8f7;--ink:#17242b;--muted:#566770;--faint:#85949b;
  --line:#dbe3e1;--line-strong:#c3cfcc;--accent:#1f5f74;--accent-soft:#e2eef1;--code-bg:#eaf0ef;
  --done:#2f7d4f;--learning:#b8821f;--consolidating:#3f88ad;--notstarted:#dde5e3;--bad:#b4432f;--hard:#a0661a;--easy:#2a6db0;
  --c1:#2a78d6;--c2:#eb6834;--grid:#e1e0d9;--axis:#c3c2b7;--tick:#77756f;
  --h0:#edf0ef;--h1:#b7d3f6;--h2:#6da7ec;--h3:#2a78d6;--h4:#184f95;
  --sans:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1517;--surface:#162024;--surface-2:#1b272c;--ink:#e3eaec;--muted:#9cadb3;--faint:#6f8188;
  --line:#243238;--line-strong:#34464d;--accent:#6fb6cb;--accent-soft:#1c3640;--code-bg:#0c1214;
  --done:#5cb783;--learning:#d7a64a;--consolidating:#6cb3c8;--notstarted:#2a3a40;--bad:#e07b66;--hard:#d7a64a;--easy:#6aa8e8;
  --c1:#3987e5;--c2:#d95926;--grid:#2c2c2a;--axis:#383835;--tick:#898781;
  --h0:#1e2a2e;--h1:#184f95;--h2:#256abf;--h3:#3987e5;--h4:#86b6ef;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1517;--surface:#162024;--surface-2:#1b272c;--ink:#e3eaec;--muted:#9cadb3;--faint:#6f8188;
  --line:#243238;--line-strong:#34464d;--accent:#6fb6cb;--accent-soft:#1c3640;--code-bg:#0c1214;
  --done:#5cb783;--learning:#d7a64a;--consolidating:#6cb3c8;--notstarted:#2a3a40;--bad:#e07b66;--hard:#d7a64a;--easy:#6aa8e8;
  --c1:#3987e5;--c2:#d95926;--grid:#2c2c2a;--axis:#383835;--tick:#898781;
  --h0:#1e2a2e;--h1:#184f95;--h2:#256abf;--h3:#3987e5;--h4:#86b6ef;
  color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.meta{color:var(--muted);font-size:14px}

/* header */
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar-top{display:flex;align-items:center;gap:16px;min-height:56px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;white-space:nowrap;letter-spacing:.01em}
.brand::before{content:'';display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:1px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;align-self:stretch;align-items:stretch;scrollbar-width:none}
nav.tabs button{border:0;background:none;padding:10px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.head-tools{display:flex;gap:8px;align-items:center;margin-left:auto}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:4px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.iconbtn{border:1px solid var(--line-strong);background:none;border-radius:8px;padding:4px 9px;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;min-height:30px}
.summary{display:flex;gap:6px 18px;align-items:center;font-size:13px;color:var(--muted);padding:6px 24px 8px;flex-wrap:wrap}
.sync{font-size:12px;color:var(--faint);margin-left:auto}
main{padding:24px 24px 96px}

/* basics */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.ph{text-align:center;color:var(--muted);padding:28px 20px;border-style:dashed}.ph .ph-icon{font-size:28px;color:var(--faint)}
.bar{height:6px;background:var(--notstarted);border-radius:3px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .d{background:var(--done)}.bar .c{background:var(--consolidating)}.bar .l{background:var(--learning)}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:9px 14px;text-align:center}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.linkbtn{background:none;border:0;color:var(--accent);text-decoration:underline;cursor:pointer;font:inherit;font-size:14px;padding:0}
.acts{display:flex;gap:8px;justify-content:flex-start;margin-top:12px;flex-wrap:wrap}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 14px}
.inp{width:100%;padding:8px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);margin:4px 0}
.toolbar .inp{flex:1 1 220px;width:auto;margin:0}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips .chip{font-size:12px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tag.ok{color:var(--done)}.tag.pri1{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}.tag.pri3{background:var(--surface-2);color:var(--faint)}
.pop{position:fixed;z-index:20;max-width:340px;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.15);font-size:14px}
.pop h4{margin:0 0 2px;font-size:17px}.pop .hint{color:var(--muted);font-size:13px}.pop .note{color:var(--learning);font-size:13px;margin-top:4px}
.spk{border:0;background:none;padding:0 4px;margin-left:6px;font-size:.8em;line-height:1;cursor:pointer;opacity:.7;vertical-align:middle}
.spk:hover,.spk:focus-visible{opacity:1}
.progress-line{display:flex;justify-content:space-between;font:13px var(--mono);color:var(--muted);margin:14px 0 6px}
table{border-collapse:collapse}
.table-wrap{overflow-x:auto}
.deck-t{width:100%;font-size:14px}.deck-t th{text-align:left;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line-strong);padding:6px 8px}
.deck-t td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}.deck-t td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.deck-t td.sr{font-weight:600;white-space:nowrap}.deck-t tr.st-leech td{background:color-mix(in srgb,var(--bad) 7%,transparent)}
.deck-t tr.st-known td.sr{color:var(--done)}

/* trainer overview */
.tr-h{margin:6px 0 4px;font-size:23px}.tr-intro{max-width:66ch;margin:0}
.tr-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0 4px}
.tr-stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tr-stat b{display:block;font-size:24px;font-weight:600}
.tr-stat span{font-size:14px;color:var(--muted)}
.goal{display:grid;grid-template-columns:auto 1fr;gap:14px 28px;align-items:center;margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.goal-ring{display:flex;align-items:center;gap:16px}
.goal-cap{display:flex;flex-direction:column;gap:3px;font-size:15px}
.goal-streak{font-size:14px;color:var(--learning)}
.ring .ring-bg{stroke:var(--notstarted)}.ring .ring-fg{stroke:var(--accent);transition:stroke-dashoffset .4s}.ring.full .ring-fg{stroke:var(--done)}
.ring .ring-t{fill:var(--ink);font:600 22px var(--sans)}
.goal-days .ring .ring-t{font-size:12px;font-weight:500}
.goal-wk-h{font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.goal-days{display:flex;gap:8px;flex-wrap:wrap}
.goal-day{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
.goal-day.today span{color:var(--accent);font-weight:600}
.goal-adj{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px;color:var(--muted)}
.goal-adj b{color:var(--ink);min-width:130px}
.goal-adj input[type=range]{flex:1 1 200px;max-width:360px;accent-color:var(--accent)}
.tr-smart{display:block;width:100%;text-align:left;margin-top:16px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:16px 18px}
.tr-smart.extra{background:var(--surface);border-style:dashed}
.tr-smart .row,.tr-deck .row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px}
.tr-smart h3{margin:0 0 3px;font-size:20px;color:var(--accent)}.tr-smart p{margin:0;font-size:15px;color:var(--muted)}
.tr-smart .go,.tr-deck .go{font-family:var(--mono);font-size:13px;color:var(--accent);text-align:right;white-space:nowrap}
.tr-smart .go b,.tr-deck .go b{display:block;font-size:24px;font-weight:500;color:var(--ink)}.tr-deck .go.zero b{color:var(--faint)}
.tr-modes{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tr-overall{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:6px}
.tr-ov-h{font-weight:600;font-size:16px}.tr-ov-bar{height:8px}
.tr-note-s{font-size:13px;color:var(--faint)}
.tr-eta{margin-top:6px;font-size:14px;color:var(--muted)}
.tr-decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px;margin-top:16px}
.tr-grp{grid-column:1/-1;font-family:var(--mono);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:14px 2px 0}
.tr-deck{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.tr-deck:hover{border-color:var(--line-strong);background:var(--surface-2)}.tr-deck.done{border-color:var(--done)}
.tr-deck h3{font-size:18px;margin:0 0 2px}.tr-deck p{margin:0;font-size:14px;color:var(--muted)}
.tr-deck .bar{height:8px;margin-top:12px}
.tr-legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:13px;color:var(--muted)}
.tr-legend span{display:flex;align-items:center;gap:6px}.tr-legend em{width:8px;height:8px;border-radius:2px;flex:none}
.tr-legend b{color:var(--ink);font-family:var(--mono);font-weight:500}
.tr-opts{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;color:var(--muted);display:block}
.tr-opts summary{cursor:pointer;font-weight:600;color:var(--ink)}
.tr-opts[open]{display:grid;gap:12px}
.opt-row{display:flex;gap:10px 22px;flex-wrap:wrap;align-items:center}
.tr-opts select{background:var(--surface);border:1px solid var(--line-strong);border-radius:7px;padding:5px 8px}
.opt-check{display:flex;gap:6px;align-items:center}
.tts-opts{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}.tts-opts .meta{flex-basis:100%;margin:0}
.tts-pauses{display:flex;flex-wrap:wrap;gap:6px 22px}
.tts-pause{display:flex;align-items:center;gap:8px}.tts-pause input{width:150px;accent-color:var(--accent)}.tts-pause b{min-width:44px;font-family:var(--mono);color:var(--ink)}
.tr-auto{display:flex;flex-direction:column;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}.tr-auto .tts-pause{flex-wrap:wrap}.tr-auto .tts-pause input{flex:1 1 140px}

/* a round */
.tr-play{max-width:720px;margin:0 auto}
.tr-hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tr-pill{font-family:var(--mono);font-size:13.5px;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tr-pill.g{color:var(--done)}.tr-pill.r{color:var(--bad)}
.tr-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 20px;text-align:center;min-height:190px;display:flex;flex-direction:column;justify-content:center;gap:10px;margin-top:14px}
.tr-box.ok{border-color:var(--done);box-shadow:0 0 0 2px color-mix(in srgb,var(--done) 35%,transparent)}
.tr-box.bad{border-color:var(--bad);box-shadow:0 0 0 2px color-mix(in srgb,var(--bad) 35%,transparent);animation:tr-shake .3s}
@keyframes tr-shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.tr-box.bad{animation:none}}
.tr-lbl{font-family:var(--mono);font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.tr-lbl.long{text-transform:none;letter-spacing:0;font-family:var(--sans);font-size:15px;line-height:1.4;color:var(--muted);text-align:center}
.tr-flag{font-size:44px;line-height:1;text-align:center;margin:0 0 8px}.tr-flag.ans{font-size:36px;margin:14px 0 6px;color:var(--muted)}
.tr-q.listen .peek{display:block;margin:12px auto 0;font-size:15px}
.tr-q{font-size:clamp(26px,5vw,36px);font-weight:600;line-height:1.25;overflow-wrap:break-word}
.tr-q.small{font-size:clamp(19px,3.4vw,24px);font-weight:500;line-height:1.4}
.tr-q .spk{font-size:.55em}
.listen-btn{font-size:44px;border:2px solid var(--accent);background:var(--accent-soft);border-radius:50%;width:96px;height:96px;margin:0 auto;display:grid;place-items:center}
.tr-hint{font-size:15px;color:var(--muted)}
.tr-ans{margin-top:10px;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:8px;text-align:left}
.tr-a{font-size:26px;font-weight:600;color:var(--done);text-align:center}.tr-a.small{font-size:20px}
.tr-tr{font-size:19px;text-align:center}
.tr-tag{font-size:13px;color:var(--faint);text-align:center;font-family:var(--mono)}
.tr-forms{font-family:var(--mono);font-size:14.5px;text-align:center;color:var(--muted)}
.tr-note{font-size:15px;color:var(--learning);border-left:3px solid var(--learning);padding:6px 10px}
.tr-ex{font-size:15.5px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:8px 10px}.tr-ex b{color:var(--ink);font-weight:600}
.tr-src{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.tr-choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.tr-choices.wide{grid-template-columns:1fr}
.tr-choice{text-align:left;background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;padding:11px 14px;font-size:17px}
.tr-choice:hover{background:var(--surface-2)}
.tr-choice.ok{border-color:var(--done);color:var(--done);font-weight:600}.tr-choice.no{border-color:var(--bad);color:var(--bad)}
.tr-acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tr-acts .btn{padding:13px 14px;font-size:17px}.tr-acts .wide{grid-column:1/-1}
.tr-acts .btn[data-key="next"]{position:relative;overflow:hidden}
.tr-acts .btn[data-key="next"].counting::after{content:'';position:absolute;left:0;bottom:0;height:4px;width:100%;background:currentColor;opacity:.45;transform-origin:left;animation:tr-count var(--auto,2000ms) linear forwards}
@keyframes tr-count{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.tr-grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.btn.grade{display:flex;flex-direction:column;gap:2px;padding:10px 6px}.btn.grade b{font-size:15px}.btn.grade span{font:12px var(--mono);color:var(--faint)}
.btn.grade.bad{border-color:var(--bad);color:var(--bad)}.btn.grade.hard{border-color:var(--hard);color:var(--hard)}
.btn.grade.good{border-color:var(--done);color:var(--done)}.btn.grade.easy{border-color:var(--easy);color:var(--easy)}
.tr-type{display:flex;gap:8px;margin-top:14px}.tr-type input{flex:1;font-size:20px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface)}
.tr-typed{text-align:center;margin-top:12px;font-family:var(--mono)}.tr-typed.ok{color:var(--done)}.tr-typed.no{color:var(--bad)}
.tr-keys{margin-top:12px;font-size:13px;color:var(--faint);text-align:center}
.tr-done{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:26px 20px;text-align:center;display:grid;gap:10px}
.tr-done .tr-acts{max-width:460px;margin:0 auto;width:100%}
.dl-line{padding:6px 10px;border-radius:10px;max-width:88%}
.dl-line.they{background:var(--surface-2);justify-self:start}
.dl-line.me{background:var(--accent-soft);justify-self:end;margin-left:auto}
.dl-line > div{font-size:14px;color:var(--muted)}

/* vocabulary check */
.qcheck h3{margin:0 0 6px}
.qrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--line)}
.qbox{margin-top:10px}
.vrow{display:flex;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line)}
.vrow input{width:18px;height:18px;accent-color:var(--done)}
.vrow .sr{font-weight:600;min-width:170px}.vrow .tr{color:var(--muted)}

/* situations */
.sit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;margin-top:14px;align-items:start}
.sit.open{grid-column:1/-1}
.sit-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.sit-h h3{margin:0}.sit-h .tag{margin-left:auto}
.sit-ready{font-size:14px;color:var(--muted);margin:8px 0 4px}
.dialog{display:grid;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.dialog h4{margin:0 0 4px}
.dl-tr summary{font-size:12px;color:var(--faint);cursor:pointer}.dl-tr{font-size:14px;color:var(--muted)}
.sit-ph{margin:14px 0 0;padding-left:18px}.sit-ph li{margin:4px 0}.sit-ph span{color:var(--muted)}

/* my texts */
.tok-key{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 14px;font-size:14px}
.text-body{white-space:pre-wrap;line-height:1.9;margin-top:12px;font-size:17px}
.tok{border-radius:3px;padding:0 1px}
.tok.known{color:inherit}
.tok.learning{background:color-mix(in srgb,var(--learning) 22%,transparent)}
.tok.deck{background:color-mix(in srgb,var(--consolidating) 20%,transparent)}
.tok.out{text-decoration:underline dotted var(--bad);text-underline-offset:4px;text-decoration-thickness:2px}
.text-body .tok[tabindex]{cursor:pointer}
.paste textarea{resize:vertical}

/* statistics */
.hero-stat{margin:12px 0 4px}.hero-v{font-size:56px;font-weight:600;line-height:1.05}.hero-l{font-size:17px;font-weight:600}
.viz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:12px;margin-top:14px}
.viz h3{margin:0 0 2px;font-size:17px}.viz > .meta{margin:0 0 8px}
.viz-svg{width:100%;height:auto;display:block;overflow:visible}
.viz-svg .grid{stroke:var(--grid);stroke-width:1}.viz-svg .axis{stroke:var(--axis);stroke-width:1}
.viz-svg .tick{fill:var(--tick);font:11px var(--sans);font-variant-numeric:tabular-nums}
.viz-svg .bar{transition:opacity .1s}.viz-svg .mark:hover .bar,.viz-svg .mark:focus .bar{opacity:.78}
.viz-svg .hit{fill:transparent}
.viz-svg .ref{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.viz-svg .ref-t{fill:var(--muted)}
.viz-svg .line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.viz-svg .dot{stroke:var(--surface);stroke-width:2}
.viz-svg .end-l{fill:var(--ink);font:600 12px var(--sans)}
.viz-svg .cross{stroke:var(--axis);stroke-width:1}
.viz-svg.heat .hc{stroke:var(--surface);stroke-width:1}
.hc.l0{fill:var(--h0);background:var(--h0)}.hc.l1{fill:var(--h1);background:var(--h1)}.hc.l2{fill:var(--h2);background:var(--h2)}.hc.l3{fill:var(--h3);background:var(--h3)}.hc.l4{fill:var(--h4);background:var(--h4)}
.heat-key{display:flex;gap:4px;align-items:center;margin-top:6px}.heat-key i{width:12px;height:12px;border-radius:3px;display:inline-block}
.viz-legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-bottom:4px}.viz-legend span{display:flex;align-items:center;gap:6px}
.viz-legend .lk{width:14px;height:2px;border-radius:1px;display:inline-block}
.viz-tip{position:fixed;z-index:30;pointer-events:none;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:6px 10px;box-shadow:0 6px 18px rgba(0,0,0,.14);font-size:13px}
.viz-tip .tv{font-weight:600;display:flex;align-items:center;gap:6px}.viz-tip .tl{color:var(--muted);display:flex;align-items:center;gap:6px}
.viz-tip .tk{width:12px;height:2px;display:inline-block}
.viz-table{margin-top:8px;font-size:13px}.viz-table summary{cursor:pointer;color:var(--muted)}
.viz-table table{margin-top:6px;width:100%}.viz-table th,.viz-table td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}.viz-table td.num{text-align:right;font-variant-numeric:tabular-nums}

@media (max-width:720px){
  .wrap{padding:0 14px}main{padding:16px 14px 80px}.summary{padding:6px 14px 8px}
  .goal{grid-template-columns:1fr}.tr-choices{grid-template-columns:1fr}.tr-grades{grid-template-columns:1fr 1fr}
  .viz-grid,.tr-decks,.sit-grid{grid-template-columns:1fr}.hero-v{font-size:44px}
  .vrow .sr{min-width:120px}
  main{padding-bottom:calc(80px + env(safe-area-inset-bottom))}.wrap{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
  input[type=text],input[type=search],input:not([type]),textarea,select{font-size:16px}
  .vrow input{width:24px;height:24px}.seg button{padding:7px 12px}
  .bar-top{gap:6px 10px}.brand{order:1}.head-tools{order:2}
  nav.tabs{order:3;flex:1 1 100%;margin:0 -14px;padding:0 6px;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
  nav.tabs button{padding:10px 9px;font-size:15px}
  .goal-days{flex-wrap:nowrap;gap:2px;justify-content:space-between}
  .goal-days .ring{width:36px;height:36px}
  .goal-ring{gap:12px}
}

/* public site: connecting the person's own data repository */
.setup{max-width:560px;margin:24px auto;display:flex;flex-direction:column;gap:12px}
.setup h2{margin:0;font-size:24px}.setup h3{margin:12px 0 0;font-size:17px}
.setup-form{display:flex;flex-direction:column;gap:12px}
.setup-form label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:15px}
.setup-form input{font-size:16px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);color:var(--ink)}
.setup-err{color:var(--bad, #b3261e);font-weight:600}
.setup-packs{display:flex;flex-direction:column;gap:8px}.setup-packs .btn{text-align:left}
.gh-help summary{cursor:pointer;font-weight:600;color:var(--accent)}.gh-steps{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.gh-steps a{word-break:break-all}
.storage{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}.storage h3{margin:0;font-size:17px}
.st-opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line-strong);border-radius:10px;cursor:pointer}
.st-opt.on{border-color:var(--accent);background:var(--accent-soft)}.st-opt input{margin-top:4px;accent-color:var(--accent)}
.st-opt span{display:flex;flex-direction:column;gap:2px}.st-confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.st-confirm p{flex:1 1 100%;margin:0}
.storage .gh-setup{display:flex;flex-direction:column;gap:10px}
[hidden]{display:none !important}

</style>

/* ---------- browser storage for the public site: IndexedDB key-value (database "polako", store "kv") ----------
   Holds the chosen set ("deck") and the progress ("progress": {T, V, LOG}). IndexedDB keeps much more than
   localStorage and the browser is asked to keep it persistent (navigator.storage.persist). */
window.PolakoIDB = (function(){
  if (!window.indexedDB) return null;
  var dbp = null;
  function open(){
    if (!dbp) dbp = new Promise(function(res, rej){
      var r = indexedDB.open('polako', 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore('kv'); };
      r.onsuccess = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); };
    });
    return dbp;
  }
  function tx(mode, fn){
    return open().then(function(db){ return new Promise(function(res, rej){
      var t = db.transaction('kv', mode), req = fn(t.objectStore('kv'));
      t.oncomplete = function(){ res(req && 'result' in req ? req.result : undefined); };
      t.onerror = function(){ rej(t.error); }; t.onabort = function(){ rej(t.error); };
    }); });
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e){}
  return {
    get: function(k){ return tx('readonly', function(s){ return s.get(k); }); },
    set: function(k, v){ return tx('readwrite', function(s){ return s.put(v, k); }); },
    del: function(k){ return tx('readwrite', function(s){ return s.delete(k); }); }
  };
})();

/* ===== fsrs.js ===== */
/* ---------- FSRS-5 scheduler ----------
   Free Spaced Repetition Scheduler (open-spaced-repetition/fsrs4anki, FSRS-5 default weights).
   A card side keeps: s — stability (days until recall drops to 90%), d — difficulty 1..10,
   due (ms), last (ms), reps, lapses. Grades: 1 Again, 2 Hard, 3 Good, 4 Easy.
   The same formulas live in tools/fsrs.py; tests/test_fsrs.py runs both on one script of answers.
   Exported as FSRS (also usable from node: module.exports). */
var FSRS = (function(){
  var W = [0.40255, 1.18385, 3.173, 15.69105, 7.1949, 0.5345, 1.4604, 0.0046, 1.54575, 0.1192,
           1.01925, 1.9395, 0.11, 0.29605, 2.2698, 0.2315, 2.9898, 0.51655, 0.6621];
  var DECAY = -0.5, FACTOR = 19 / 81, DAYMS = 86400000, MAX_IVL = 3650, RELEARN_MS = 10 * 60000;
  function clamp(x, a, b){ return Math.min(b, Math.max(a, x)); }
  function r4(x){ return Math.round(x * 10000) / 10000; }
  function retrievability(elapsedDays, s){ return Math.pow(1 + FACTOR * elapsedDays / s, DECAY); }
  function interval(s, retention){ return s / FACTOR * (Math.pow(retention, 1 / DECAY) - 1); }
  function d0(g){ return clamp(W[4] - Math.exp(W[5] * (g - 1)) + 1, 1, 10); }
  function s0(g){ return Math.max(0.1, W[g - 1]); }
  function nextD(d, g){
    var dd = -W[6] * (g - 3), d1 = d + dd * (10 - d) / 9;
    return clamp(W[7] * d0(4) + (1 - W[7]) * d1, 1, 10);
  }
  function sRecall(d, s, r, g){
    var hard = g === 2 ? W[15] : 1, easy = g === 4 ? W[16] : 1;
    return s * (1 + Math.exp(W[8]) * (11 - d) * Math.pow(s, -W[9]) * (Math.exp(W[10] * (1 - r)) - 1) * hard * easy);
  }
  function sForget(d, s, r){
    return Math.min(s, W[11] * Math.pow(d, -W[12]) * (Math.pow(s + 1, W[13]) - 1) * Math.exp(W[14] * (1 - r)));
  }
  function sShort(s, g){ return s * Math.exp(W[17] * (g - 3 + W[18])); }
  /* review(card or null, grade, now ms, target retention) → new card + log fields */
  function review(c, g, now, retention){
    retention = retention || 0.9;
    var n = {reps: 0, lapses: 0}, elapsed = 0, sBefore = 0, rBefore = 1;
    if (!c || !c.s){
      n.s = s0(g); n.d = d0(g);
    } else {
      elapsed = Math.max(0, (now - (c.last || now)) / DAYMS);
      sBefore = c.s; rBefore = retrievability(elapsed, c.s);
      n.reps = c.reps || 0; n.lapses = c.lapses || 0; n.f = c.f;
      n.d = nextD(c.d || d0(3), g);
      if (elapsed < 1) n.s = sShort(c.s, g);
      else if (g === 1){ n.s = sForget(c.d || d0(3), c.s, rBefore); n.lapses++; }
      else n.s = sRecall(c.d || d0(3), c.s, rBefore, g);
    }
    n.s = clamp(n.s, 0.1, 36500);
    n.reps++;
    n.last = now; if (!n.f) n.f = now;
    if (g === 1) n.due = now + RELEARN_MS;
    else n.due = now + clamp(Math.round(interval(n.s, retention)), 1, MAX_IVL) * DAYMS;
    n.s = r4(n.s); n.d = r4(n.d);
    return {card: n, elapsed: r4(elapsed), sBefore: r4(sBefore), r: r4(rBefore)};
  }
  /* days from now until the side reaches stability `target` if every answer is Good at its due date */
  function daysToStable(c, now, retention, target){
    var s = c && c.s ? c.s : 0, d = c && c.d ? c.d : d0(3), t = 0, guard = 0;
    if (!s){ s = s0(3); d = d0(3); t = 1; }
    else t = Math.max(0, ((c.due || now) - now) / DAYMS);
    while (s < target && guard++ < 40){
      var ivl = clamp(Math.round(interval(s, retention)), 1, MAX_IVL);
      s = sRecall(d, s, retrievability(ivl, s), 3); d = nextD(d, 3);
      if (s < target) t += clamp(Math.round(interval(s, retention)), 1, MAX_IVL);
    }
    return t;
  }
  function setW(w){ if (w && w.length === 19 && w.every(function(x){ return typeof x === 'number' && isFinite(x); })) W = w.slice(); }
  return {setW: setW, weights: function(){ return W.slice(); }, review: review, retrievability: retrievability, interval: interval, daysToStable: daysToStable, DAYMS: DAYMS};
})();

/* ---------- pronunciation: Web Speech API (speechSynthesis) ----------

   system, so the chain is sr → hr → bs (Croatian and Bosnian voices read Serbian Latin text well;

   Settings per device (localStorage pl.tts). No voice at all → no 🔊 buttons and no listening side. */

  function score(v){ var n = v.name || '', s = 0; if (/enhanced|premium|natural|neural|online|google/i.test(n)) s += 4; if (v.default) s += 1; return s; }
  return vs.slice().sort(function(a, b){ return score(b) - score(a); })[0] || null;
}
function ttsVoice(lang){

    if (TTS_CFG.voice){ var ch = TTS.voices.filter(function(v){ return v.name === TTS_CFG.voice; })[0]; if (ch) return ch; }
    for (var i = 0; i < SR_CHAIN.length; i++){ var v = bestOf(voicesFor(SR_CHAIN[i])); if (v) return v; }
    return null;

function srVoiceInfo(){ var v = ttsVoice('sr'); if (!v) return null; var l = (v.lang || '').slice(0, 2).toLowerCase(); return {name: v.name, lang: v.lang, fallback: l !== 'sr'}; }

  if (!TTS.ok || !text){ fin(); return false; }
  if (!TTS.voices.length) ttsLoad();

  try {
    speechSynthesis.cancel();

    var u = new SpeechSynthesisUtterance(s);

    u.onend = fin; u.onerror = fin;

    setTimeout(function wait(){ var busy = false; try { busy = speechSynthesis.speaking; } catch (e){}
      if (busy && Date.now() - t0 < 20000) setTimeout(wait, 200); else fin(); }, (900 + 85 * s.length) / (u.rate || 1));

var SFX = null;
function sfx(kind){

    SFX = SFX || new AC(); if (SFX.state === 'suspended') SFX.resume();

/* ===== trainer.js ===== */
/* ---------- Trainer ----------
   Learning items: words, phrases, cloze (a form in a sentence), aspect pairs (kupiti / kupovati),
   dialog replies (they say → I answer). Each item is asked from several SIDES, each side with its own
   FSRS card (key "<id>|<side>"):
     word    stage 1 (recognition): pick-tr (sr → choose the meaning of 6), listen (hear → choose the
             meaning; when a Serbian/Croatian/Bosnian voice exists), pick-sr (meaning → choose sr of 6)
             stage 2 (recall, from the next day once stage 1 is answered): say-tr, say-sr, type (if on)
     phrase  listen-ph (or read-ph without a voice) → then say-ph (meaning → say it, self-grade)
     cloze   choose the right form · pair: name both aspects · dialog: choose my reply
   A choice answer is graded by itself: right and fast → Good, right but slow → Hard, wrong → Again.
   Recall sides are self-graded with four buttons (Again · Hard · Good · Easy), each showing its next
   interval. A wrong answer returns the side to the end of the same round. A side forgotten 6+ times
   is a "leech": it leaves the rounds and waits on the statistics tab for a mnemonic. */
var LEARNED_S = 21, FIRM_S = 7, KNOWN_S = 7, LEECH = 6, TRB = 50;
var play = null;
/* no sound-only cards: every card shows the word in writing (the voice plays along on its own) */
function listenOn(){ return false; }
var ITEMS_CACHE = null;
function allItems(){
  if (ITEMS_CACHE) return ITEMS_CACHE;
  var out = [], ids = {};
  DECK.words.forEach(function(w){ out.push({kind: 'word', id: w.id, it: w, rank: w.rank}); ids[w.id] = w; });
  DECK.phrases.forEach(function(p){ out.push({kind: 'phrase', id: p.id, it: p, rank: (p.rank || 1) * 2 + 20, words: p.words || []}); });
  DECK.cloze.forEach(function(c){ var w = ids[c.word]; if (w) out.push({kind: 'cloze', id: c.id, it: c, w: w, rank: w.rank + 0.5, words: [w.id]}); });
  var done = {};
  DECK.words.forEach(function(w){ var o = w.pair && ids[w.pair]; if (!o) return;
    var a = w.asp === 'pf' ? w : o, b = a === w ? o : w, id = 'v:' + a.id.slice(2) + '--' + b.id.slice(2);
    if (done[id]) return; done[id] = 1; out.push({kind: 'pair', id: id, a: a, b: b, rank: Math.max(a.rank, b.rank) + 0.5, words: [a.id, b.id]}); });
  SITS.forEach(function(s){ (s.dialogs || []).forEach(function(d){ (d.lines || []).forEach(function(ln, i){
    if (ln.who === 'me' && i > 0 && d.lines[i - 1].who === 'they')
      out.push({kind: 'dialog', id: 'd:' + d.id + ':' + i, they: d.lines[i - 1], me: ln, sit: s.id, rank: 30 + (s.pri || 2) * 20 + i}); }); }); });
  ITEMS_CACHE = out; return out;
}
function itemsOfKind(k){ return allItems().filter(function(x){ return x.kind === k; }); }

function cardOf(item, side){ return T.cards[key(item, side)]; }

  if (item.kind === 'word') return listenOn() ? ['pick-tr', 'listen', 'pick-sr'] : ['pick-tr', 'pick-sr'];
  if (item.kind === 'phrase') return [listenOn() ? 'listen-ph' : 'read-ph'];
  return [item.kind === 'cloze' ? 'cloze' : item.kind === 'pair' ? 'aspect' : 'reply'];
}
function stage2(item){
  if (item.kind === 'word') return T.typing ? ['say-tr', 'say-sr', 'type'] : ['say-tr', 'say-sr'];
  if (item.kind === 'phrase') return T.typing ? ['say-ph', 'type-ph'] : ['say-ph'];
  return [];
}
function unlocked(item){
  var t0 = today0();
  return stage1(item).every(function(sd){ var c = cardOf(item, sd); return c && c.s >= 1 && c.f < t0; });
}
function sidesOf(item){ var s1 = stage1(item); return unlocked(item) ? s1.concat(stage2(item)) : s1; }

    var w = el('span'), i = el('em'); i.style.background = 'var(' + x[0] + ')'; w.appendChild(i); w.appendChild(document.createTextNode(L(x[1]) + ' ')); w.appendChild(el('b', null, x[2])); lg.appendChild(w);

/* ---------- coverage, streak, history ---------- */
function understood(){

    var best = 0; ['say-tr', 'pick-tr', 'listen'].forEach(function(sd){ var c = cardOf(it, sd); if (c && c.s > best) best = c.s; });

/* ===== ghstore.js ===== */
/* ---------- storage in the person's own GitHub repository (the public site: firstpilotpirx.github.io/polako) ----------
   The site is the same page without personal data. Words and progress live in a private repository the person
   connects once per device (repository name + a fine-grained token with "Contents: read and write" on that one
   repository; both stay in this browser's localStorage, key pl.gh). Layout of the data repository:
     deck.json                    the page data: words, phrases, situations (built by tools/build_page.py)
     prep/trainer-state.json      FSRS cards and settings          ← same files as the local mode,
     prep/vocab-state.json        "I know" marks                     so the Claude plugin reads them as is
     prep/log/YYYY-MM.json        every answer, one file per month
   Saving is batched into one commit: after a pause in answering (45 s), at most every 2 min while answering,
   when a round ends and when the page is hidden. Before writing, the latest version is read and merged:
   cards — the side reviewed last wins; marks — the newer record; answers — union. So two devices never
   overwrite each other. On return to the page the newest state is pulled again. */
var GH = (function(){
  var cfg = window.POLAKO_GH || null, API = 'https://api.github.com', branch = null;
  function on(){ return !!(cfg && cfg.repo && cfg.token); }
  function b64enc(s){ return btoa(unescape(encodeURIComponent(s))); }
  function b64dec(s){ return decodeURIComponent(escape(atob(String(s).replace(/\s/g, '')))); }
  async function req(method, path, body){
    var r = await fetch(API + path, {method: method, cache: 'no-store', headers: {'Authorization': 'Bearer ' + cfg.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}, body: body ? JSON.stringify(body) : undefined});
    if (r.status === 404) return null;
    if (!r.ok){ var e = new Error('github ' + r.status); e.status = r.status; throw e; }
    return r.status === 204 ? {} : r.json();
  }
  function repo(p){ return '/repos/' + cfg.repo + p; }
  // the branch's head commit; null for an empty repository (GitHub answers 409 there)
  async function refOf(br){ try { return await req('GET', repo('/git/ref/heads/' + br)); } catch (e){ if (e.status === 409) return null; throw e; } }
  async function getBranch(){ if (!branch){ var r = await req('GET', repo('')); if (!r) { var e = new Error('no repo'); e.status = 404; throw e; } branch = r.default_branch || 'main'; } return branch; }
  // a file's text (null when absent); files over 1 MB come through the blob API
  async function read(path, ref){
    var r = await req('GET', repo('/contents/' + path + (ref ? '?ref=' + ref : '')));
    if (!r || Array.isArray(r)) return null;
    if (r.content == null || (r.encoding === 'none' && r.size)){ var bl = await req('GET', repo('/git/blobs/' + r.sha)); return bl ? b64dec(bl.content) : null; }
    return b64dec(r.content);
  }
  async function readJSON(path, ref, dflt){ var t = await read(path, ref); if (t == null) return dflt; try { return JSON.parse(t); } catch (e){ return dflt; } }
  async function list(path, ref){ var r = await req('GET', repo('/contents/' + path + (ref ? '?ref=' + ref : ''))); return Array.isArray(r) ? r : []; }
  // first file of an empty repository: the contents API creates the first commit
  async function putFile(path, text, msg){
    var cur = await req('GET', repo('/contents/' + path));
    return req('PUT', repo('/contents/' + path), {message: msg, content: b64enc(text), sha: cur && cur.sha || undefined});
  }
  // several files in one commit; null when the branch moved meanwhile (the caller re-reads and retries)
  async function commit(files, msg){
    var br = await getBranch();
    var ref = await refOf(br);
    if (!ref){   // empty repository
      for (var i = 0; i < files.length; i++) await putFile(files[i].path, files[i].text, msg);
      return true;
    }
    var head = ref.object.sha, c = await req('GET', repo('/git/commits/' + head));
    var tree = await req('POST', repo('/git/trees'), {base_tree: c.tree.sha, tree: files.map(function(f){ return {path: f.path, mode: '100644', type: 'blob', content: f.text}; })});
    var nc = await req('POST', repo('/git/commits'), {message: msg, tree: tree.sha, parents: [head]});
    try { await req('PATCH', repo('/git/refs/heads/' + br), {sha: nc.sha, force: false}); }
    catch (e){ if (e.status === 422 || e.status === 409) return null; throw e; }
    return true;
  }
  async function headSha(){ var br = await getBranch(), ref = await refOf(br); return ref ? ref.object.sha : null; }
  async function check(){ var r = await req('GET', repo('')); if (!r){ var e = new Error('repo'); e.status = 'repo'; throw e; } branch = r.default_branch || 'main'; return r; }
  return {on: on, cfg: function(){ return cfg; }, setCfg: function(c){ cfg = c; branch = null; }, check: check, read: read, readJSON: readJSON, list: list, commit: commit, putFile: putFile, headSha: headSha};
})();

/* ---------- merging two copies of the progress (this device and the repository) ---------- */
function mergeCards(a, b){
  var out = {}, k;
  for (k in a) out[k] = a[k];
  for (k in b){ var x = out[k], y = b[k]; if (!x || (y.last || 0) > (x.last || 0) || ((y.last || 0) === (x.last || 0) && (y.reps || 0) > (x.reps || 0))) out[k] = y; }
  return out;
}
function mergeT(local, remote){
  if (!remote || !remote.cards) return local;
  if (local.reset && local.reset > (remote.updated || 0)) return local;   // a reset made here wins over older progress
  if (remote.reset && remote.reset > (local.updated || 0)) return Object.assign({}, remote);
  var newer = (remote.updated || 0) > (local.updated || 0) ? remote : local;
  var out = Object.assign({}, local, newer);
  out.cards = mergeCards(local.cards || {}, remote.cards || {});
  out.hist = Object.assign({}, remote.hist || {}, local.hist || {});
  return out;
}
function mergeV(local, remote){
  var out = Object.assign({}, remote || {});
  for (var k in local){ var x = out[k], y = local[k]; if (!x || (y && (y.at || 0) >= (x.at || 0))) out[k] = y; }
  return out;
}
function mergeLog(a, b){
  var seen = {}, out = [];
  a.concat(b).forEach(function(x){ var k = x[0] + '|' + x[1]; if (!seen[k]){ seen[k] = 1; out.push(x); } });
  return out.sort(function(x, y){ return x[0] - y[0]; });
}
function monthKey(ts){ var d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }

/* read everything from the repository and merge it into this device's copy */
async function ghPull(){
  var ref = await GH.headSha();
  var t = await GH.readJSON('prep/trainer-state.json', ref, null);
  var v = await GH.readJSON('prep/vocab-state.json', ref, null);
  var files = (await GH.list('prep/log', ref)).filter(function(f){ return /\.json$/.test(f.name); });
  var all = [];
  for (var i = 0; i < files.length; i++){ var part = await GH.readJSON('prep/log/' + files[i].name, ref, []); if (Array.isArray(part)) all = all.concat(part); }
  if (t) T = mergeT(T, t);
  if (v) V = mergeV(V, v);
  LOG = mergeLog(LOG, all);
  ITEMS_CACHE = null;
}
/* write this device's changes as one commit (re-reading and merging if another device wrote meanwhile) */
async function ghPush(items){
  for (var attempt = 0; attempt < 3; attempt++){
    var ref = await GH.headSha();
    var rt = await GH.readJSON('prep/trainer-state.json', ref, null), rv = await GH.readJSON('prep/vocab-state.json', ref, null);
    var t = mergeT(T, rt), v = mergeV(V, rv), files = [];
    if (store.dirtyT || !rt){ T = t; files.push({path: 'prep/trainer-state.json', text: JSON.stringify(t)}); }
    if (store.dirtyV || !rv){ V = v; files.push({path: 'prep/vocab-state.json', text: JSON.stringify(v, null, 1)}); }
    var months = {};
    items.forEach(function(x){ (months[monthKey(x[0])] = months[monthKey(x[0])] || []).push(x); });
    for (var m in months){ var old = await GH.readJSON('prep/log/' + m + '.json', ref, []); files.push({path: 'prep/log/' + m + '.json', text: JSON.stringify(mergeLog(Array.isArray(old) ? old : [], months[m]))}); }
    if (!files.length) return;
    var n = items.length, msg = 'Polako: ' + (n ? L('ghAnswers') + ' ' + n : L('ghProgress')) + ' · ' + new Date().toLocaleString(TRL);
    if (await GH.commit(files, msg)) return;
  }
  throw new Error('github: the branch keeps moving');
}

/* ---------- this browser's copy (the public site): IndexedDB, written on every save, read at start ---------- */
var IDBK = window.POLAKO_SITE && window.PolakoIDB ? window.PolakoIDB : null, idbTimer = null;
function idbSave(){
  if (!IDBK) return;
  clearTimeout(idbTimer);
  idbTimer = setTimeout(function(){ IDBK.set('progress', {T: T, V: V, LOG: LOG}).catch(function(){}); }, 300);
}
async function idbLoad(){
  if (!IDBK) return false;
  try {
    var p = await IDBK.get('progress');
    if (!p) return false;
    if (p.T) T = mergeT(T, p.T);
    if (p.V) V = mergeV(V, p.V);
    if (p.LOG) LOG = mergeLog(LOG, p.LOG);
    ITEMS_CACHE = null; return true;
  } catch (e){ return false; }
}

/* ---------- "Где хранить прогресс" in the trainer's settings (the public site only) ---------- */
function deckText(){ var d = document.getElementById('pl-data'); return d ? d.textContent : JSON.stringify(D); }
async function ghConnect(cfg, msg){
  msg.textContent = L('ghConnecting'); msg.className = 'meta';
  try {
    GH.setCfg(cfg);
    await GH.check();
    var remoteDeck = await GH.read('deck.json');
    if (remoteDeck == null){   // an empty repository: this browser's set and all its progress go there
      await GH.commit([{path: 'deck.json', text: deckText()}, {path: 'polako.json', text: JSON.stringify({kind: 'polako-data', version: 1}, null, 1) + '\n'}], 'Polako: ' + L('ghFirstCommit'));
    } else {
      await ghPull();          // the repository already has words and progress: merge them with this browser's
    }
    store.dirtyT = true; store.dirtyV = true;
    await ghPush(LOG.slice());
    if (IDBK){ try { await IDBK.set('progress', {T: T, V: V, LOG: LOG}); } catch (e){} }
    window.polakoStorage.set(cfg);
    msg.textContent = L('ghConnected2'); setTimeout(function(){ location.reload(); }, 600);
  } catch (e){
    GH.setCfg(null); msg.textContent = window.polakoGithubError ? window.polakoGithubError(e) : String(e.status || e.message); msg.className = 'setup-err';
  }
}

/* ===== boot.js ===== */
/* ---------- boot: theme, first render, storage (local server → artifact db → this browser) ---------- */
$('theme').onclick = function(){ var dark = ui.theme ? ui.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; ui.theme = dark ? 'light' : 'dark'; lsSet('pl.theme', ui.theme); applyTheme(); };
applyTheme();
if (D.fsrs && D.fsrs.w) FSRS.setW(D.fsrs.w);   // personal weights from tools/fsrs_fit.py
(function(){ var fb = lsGet('pl.fallback', null); if (fb){ if (fb.T && fb.T.cards) T = Object.assign(T, fb.T); LOG = fb.LOG || []; V = fb.V || {}; } })();
if (!TABS.some(function(t){ return t[0] === ui.tab; })) ui.tab = 'train';
render();
setTimeout(function(){ if (TTS.ok){ ttsLoad(); if (!play) render(); } }, 700);   // voices arrive late in some browsers

(async function(){
  var local = /^https?:$/.test(location.protocol) && /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  if (local){
    try {
      var ping = await fetch('/api/ping', {cache: 'no-store'});
      if (ping.ok){
        store.mode = 'api';
        var tr = await (await fetch('/api/trainer')).json(); if (tr && tr.cards) T = Object.assign(T, tr);
        var lg = await (await fetch('/api/log')).json(); if (Array.isArray(lg)) LOG = lg;
        var vc = await (await fetch('/api/vocab')).json(); if (vc && typeof vc === 'object') V = vc;
        ITEMS_CACHE = null; render(); setSync(L('live')); liveReload(); return;
      }
    } catch (e){}
  }
  if (window.POLAKO_SITE) await idbLoad();   // the public site: this browser's copy first (works offline too)
  if (typeof GH !== 'undefined' && GH.on()){   // the public site with the person's own repository
    try {
      setSync(L('ghLoading')); await ghPull(); store.mode = 'gh';
      if (window.POLAKO_GH_EMPTY){   // connected to an empty repository: put this set and the progress there
        await GH.commit([{path: 'deck.json', text: deckText()}, {path: 'polako.json', text: JSON.stringify({kind: 'polako-data', version: 1}, null, 1) + '\n'}], 'Polako: ' + L('ghFirstCommit'));
        store.dirtyT = true; store.dirtyV = true; await ghPush(LOG.slice()); window.POLAKO_GH_EMPTY = false;
      }
      render(); setSync(L('ghSaved'));
    } catch (e){ store.mode = 'local'; render(); setSync(L('ghFail') + ' (' + (e.status || e.message) + ')'); }
    // leaving the page saves; coming back pulls what other devices did; offline → catch up when GitHub answers
    var resync = function(){
      if (play) return;
      var pending = store.mode === 'local' && (store.dirtyT || store.dirtyV || LOGNEW.length);
      ghPull().then(function(){ store.mode = 'gh'; if (pending){ store.dirtyT = true; store.dirtyV = true; return flush(); } })
        .then(function(){ render(); setSync(L('ghSaved')); }).catch(function(){});
    };
    document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'hidden') flush(); else resync(); });
    window.addEventListener('online', resync);
    return;
  }
  try {
    var h = !window.POLAKO_SITE && window.claude && window.claude.use ? await window.claude.use('db') : null;
    if (!h){ if (window.POLAKO_SITE){ render(); setSync(L('savedBrowser')); } else setSync(L('savedLocal')); return; }
    // read everything first; writes are enabled only after (store.db = h), so nothing is written unread
    var t = await h.doc('trainer/state').get(), v = await h.collection('vocab').get(), l = await h.collection('log').get();
    if (t.exists && t.data().cards){ var remote = clone(t.data()); remote.cards = Object.assign(remote.cards, store.dirtyT ? T.cards : {}); T = Object.assign(T, remote); }
    V = {}; v.docs.forEach(function(d){ V[d.id] = clone(d.data()); });
    var all = []; l.docs.forEach(function(d){ (d.data().items || []).forEach(function(x){ all.push(x); }); });
    var mine = LOGNEW.slice(); LOG = all.concat(mine).sort(function(a, b){ return a[0] - b[0]; });
    store.db = h; store.mode = 'db';
    ITEMS_CACHE = null; render(); setSync(L('saved'));
    if (store.dirtyT || LOGNEW.length) flush();
  } catch (e){ store.mode = 'local'; setSync(L('savedLocal')); }
})();
/* the agent rebuilt the page → version.json changed → reload in place (never in the middle of a round) */
function liveReload(){
  var y = sessionStorage.getItem('pl.scroll'); if (y){ sessionStorage.removeItem('pl.scroll'); setTimeout(function(){ scrollTo(0, +y); }, 50); }
  setInterval(async function(){
    try {
      var v = await (await fetch('version.json', {cache: 'no-store'})).json();
      if (v.id && v.id !== (D.build || {}).id && !play){ await flush(); try { sessionStorage.setItem('pl.scroll', String(scrollY)); } catch (e){} location.reload(); }
    } catch (e){}
  }, 2500);
}
window.addEventListener('beforeunload', function(){ if (store.mode === 'api' && (store.dirtyT || LOGNEW.length)){ try { navigator.sendBeacon('/api/trainer', new Blob([JSON.stringify(T)], {type: 'application/json'})); if (LOGNEW.length) navigator.sendBeacon('/api/log', new Blob([JSON.stringify({items: LOGNEW})], {type: 'application/json'})); } catch (e){} } });
/* for the page's own tests and the site's loader: save now, read the current state */
window.polakoFlush = function(){ return flush(); };
window.polakoState = function(){ return {cards: Object.keys(T.cards || {}).length, log: LOG.length, mode: store.mode}; };

};
/* ---------- the public site: choose where words and progress live, then start the page ----------
   Two kinds of storage, switchable any time in the trainer's settings ("Где хранить прогресс"):
     browser — nothing to set up: the chosen set and all progress live in this browser (IndexedDB, asked to be
               persistent; localStorage as a fallback). One device.
     github  — the person's private repository (owner/name + a fine-grained token with "Contents: read and
               write" on that repository only): words and progress shared by all their devices. Connecting moves
               the progress made in the browser into the repository.
   The choice is kept in localStorage (pl.storage); the token never leaves this browser except to api.github.com.
   The site itself holds no personal data. */
(function(){
  var KEY = 'pl.storage', U = window.POLAKO_UI || {};
  function L(k){ return U[k] != null ? U[k] : k; }
  function cfgGet(){
    try {
      var c = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (!c){ var old = JSON.parse(localStorage.getItem('pl.gh') || 'null'); if (old && old.repo) c = {type: 'github', repo: old.repo, token: old.token}; }
      return c;
    } catch (e){ return null; }
  }
  function cfgSet(v){ try { if (v) localStorage.setItem(KEY, JSON.stringify(v)); else localStorage.removeItem(KEY); localStorage.removeItem('pl.gh'); } catch (e){} }
  window.polakoStorage = {get: cfgGet, set: cfgSet};
  function $(id){ return document.getElementById(id); }
  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function start(json){ $('pl-data').textContent = json; window.__polakoStart(); }

  /* the set for browser mode: the site's current version of the pack (fixes arrive), the stored copy offline */
  async function browserDeck(cfg){
    var IDB = window.PolakoIDB, saved = null;
    try { saved = IDB ? await IDB.get('deck') : null; } catch (e){}
    var pack = (window.POLAKO_PACKS || []).filter(function(p){ return 'pack:' + p.name === cfg.source; })[0];
    if (pack){
      try {
        var r = await fetch(pack.file, {cache: 'no-store'});
        if (r.ok){ var t = await r.text(); try { if (IDB) await IDB.set('deck', t); } catch (e){} return t; }
      } catch (e){}
    }
    return saved;
  }
  async function gh(cfg, path){
    return fetch('https://api.github.com/repos/' + cfg.repo + path, {cache: 'no-store',
      headers: {'Authorization': 'Bearer ' + cfg.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}});
  }
  function b64dec(s){ return decodeURIComponent(escape(atob(String(s).replace(/\s/g, '')))); }
  async function githubDeck(cfg){
    var rr = await gh(cfg, '');   // a private repository without access answers 404 too
    if (!rr.ok){ var e0 = new Error(String(rr.status)); e0.status = rr.status === 404 ? 'repo' : rr.status; throw e0; }
    var r = await gh(cfg, '/contents/deck.json');
    if (r.status === 404) return null;
    if (!r.ok){ var e = new Error(String(r.status)); e.status = r.status; throw e; }
    var j = await r.json();
    if (j.content == null || (j.encoding === 'none' && j.size)){ var b = await (await gh(cfg, '/git/blobs/' + j.sha)).json(); return b64dec(b.content); }
    return b64dec(j.content);
  }
  window.polakoGithubError = function(e){
    return e.status === 401 ? L('setupBadToken') : e.status === 'repo' || e.status === 403 ? L('setupNoAccess') : L('setupFail') + ' (' + (e.status || e.message) + ')';
  };

  function screen(build){
    var main = $('main'); main.innerHTML = ''; var c = el('div', 'card setup'); build(c); main.appendChild(c);
    var s = $('summary'); if (s) s.hidden = true;
  }
  function welcome(err){
    screen(function(c){
      c.appendChild(el('h2', null, L('setupTitle')));
      c.appendChild(el('p', null, L('setupIntro')));
      if (err) c.appendChild(el('p', 'setup-err', err));
      c.appendChild(el('h3', null, L('setupStartBrowser')));
      c.appendChild(el('p', 'meta', L('setupStartBrowserNote')));
      var box = el('div', 'setup-packs');
      (window.POLAKO_PACKS || []).forEach(function(p){
        var b = el('button', 'btn primary', p.title + ' — ' + p.words + ' ' + L('setupWords')); b.type = 'button';
        b.onclick = function(){ cfgSet({type: 'browser', source: 'pack:' + p.name}); boot(); }; box.appendChild(b);
      });
      c.appendChild(box);
      c.appendChild(el('h3', null, L('setupStartGithub')));
      c.appendChild(el('p', 'meta', L('setupStartGithubNote')));
      c.appendChild(window.polakoGithubForm(function(cfg){ cfgSet(cfg); boot(); }));
    });
  }
  /* the GitHub form with the step-by-step help; used here and in the trainer's settings */
  window.polakoGithubForm = function(onConnect, prefill){
    var wrap = el('div', 'gh-setup');
    var steps = el('ol', 'gh-steps');
    [['ghStep1', 'https://github.com/new'], ['ghStep2', 'https://github.com/settings/personal-access-tokens/new'], ['ghStep3', null]].forEach(function(s){
      var li = el('li'); li.appendChild(document.createTextNode(L(s[0]) + ' '));
      if (s[1]){ var a = el('a', null, s[1].replace('https://', '')); a.href = s[1]; a.target = '_blank'; a.rel = 'noopener'; li.appendChild(a); }
      steps.appendChild(li);
    });
    var det = el('details', 'gh-help'); det.appendChild(el('summary', null, L('ghHowTo'))); det.appendChild(steps);
    var more = el('p', 'meta'); var a2 = el('a', null, L('setupHelp')); a2.href = 'https://github.com/firstpilotpirx/polako#2-синхронизация-между-устройствами-через-github'; a2.target = '_blank'; a2.rel = 'noopener'; more.appendChild(a2); det.appendChild(more);
    wrap.appendChild(det);
    var f = el('form', 'setup-form');
    var r1 = el('label', null, L('setupRepo')), i1 = el('input'); i1.placeholder = L('setupRepoPh'); i1.autocapitalize = 'off'; i1.spellcheck = false; i1.value = (prefill || {}).repo || ''; r1.appendChild(i1);
    var r2 = el('label', null, L('setupToken')), i2 = el('input'); i2.type = 'password'; i2.placeholder = 'github_pat_…'; i2.autocomplete = 'off'; r2.appendChild(i2);
    var go = el('button', 'btn', L('setupConnect')); go.type = 'submit';
    f.appendChild(r1); f.appendChild(r2); f.appendChild(go);
    f.onsubmit = function(ev){ ev.preventDefault();
      var repo = i1.value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\.git$/, '').replace(/\/$/, ''), tok = i2.value.trim();
      if (!/^[\w.-]+\/[\w.-]+$/.test(repo)){ i1.focus(); return; } if (!tok){ i2.focus(); return; }
      go.disabled = true; go.textContent = L('ghConnecting');
      Promise.resolve(onConnect({type: 'github', repo: repo, token: tok})).catch(function(){}).then(function(){ go.disabled = false; go.textContent = L('setupConnect'); });
    };
    wrap.appendChild(f);
    return wrap;
  };

  async function boot(){
    var cfg = cfgGet();
    window.POLAKO_SITE = true;
    if (!cfg){ welcome(); return; }
    screen(function(c){ c.appendChild(el('p', 'meta', L(cfg.type === 'github' ? 'ghLoading' : 'loading'))); });
    if (cfg.type === 'browser'){
      var t = await browserDeck(cfg);
      if (!t){ cfgSet(null); welcome(L('setupFail')); return; }
      window.POLAKO_STORE = cfg; start(t); return;
    }
    try {
      var json = await githubDeck(cfg);
      if (json == null){   // an empty repository: the person's current set (from the browser) or a pack goes there on connect
        var local = null; try { local = window.PolakoIDB ? await window.PolakoIDB.get('deck') : null; } catch (e){}
        if (!local){ var p = (window.POLAKO_PACKS || [])[0]; if (p){ var r = await fetch(p.file, {cache: 'no-store'}); local = await r.text(); } }
        window.POLAKO_STORE = cfg; window.POLAKO_GH = cfg; window.POLAKO_GH_EMPTY = true; start(local); return;
      }
      try { if (window.PolakoIDB) await window.PolakoIDB.set('deck', json); } catch (e){}   // the offline copy
      window.POLAKO_STORE = cfg; window.POLAKO_GH = cfg; start(json);
    } catch (e){
      if (e.status === 401 || e.status === 403 || e.status === 'repo'){ welcome(window.polakoGithubError(e)); return; }
      // no network: the last copy from this browser; the page saves here and syncs when GitHub answers again
      var copy = null; try { copy = window.PolakoIDB ? await window.PolakoIDB.get('deck') : null; } catch (e2){}
      if (!copy){ welcome(window.polakoGithubError(e)); return; }
      window.POLAKO_STORE = cfg; window.POLAKO_GH = cfg; start(copy);
    }
  }
  boot();
})();

})();
