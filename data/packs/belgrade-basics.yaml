# Набор «Белград: первые разговоры» — минимальный словарь для восьми ситуаций.
# Ставится в папку ученика командой: run pack.py --dir <folder> install belgrade-basics
#
# Принцип отбора — 80/20: минимум слов, который даёт максимум понимания. Порядок изучения — по важности,
# не по темам (поле tier у каждого слова):
#   tier 1 — база (~110): местоимения, предлоги, вопросы, частые глаголы, числа, вежливые формулы.
#            Они нужны во всех ситуациях сразу и дают основную часть покрытия живой речи.
#   tier 2 — ключевые слова ситуаций (~95): без них разговор в конкретном месте не складывается
#            (документ, заверить, сколько стоит, болит…).
#   tier 3 — полезные (~65): учить, когда первые два уровня держатся.
# removed — слова, убранные при ревью как лишние для минимума (в колоде уходят в архив, прогресс сохраняется).
# Диалоги — ориентир «как это обычно звучит»; детали процедур (сроки, суммы) — примеры, не справка.
# Экавица, латиница. Переводы — русский.
version: 1
id: belgrade-basics
title: "Белград: первые разговоры"
title_sr: "Beograd: prvi razgovori"
explain: ru
desc: "Соседи, магазин, булочная, детская площадка, врач, МУП (ВНЖ и ПМЖ, справки), нотариус/юрист/бухгалтер, дружеская беседа с коллегой."

situations:
  - id: komsije
    title: "Соседи в подъезде"
    title_sr: "Komšije u zgradi"
    pri: 1
    dialogs:
      - id: komsije-1
        title: "Встреча на лестнице"
        lines:
          - {who: they, sr: "Dobar dan, komšija! Kako ste?", tr: "Добрый день, сосед! Как вы?"}
          - {who: me, sr: "Dobro, hvala. A vi?", tr: "Хорошо, спасибо. А вы?"}
          - {who: they, sr: "Evo, polako. Idete na posao?", tr: "Да потихоньку. На работу идёте?"}
          - {who: me, sr: "Da, žurim. Vidimo se!", tr: "Да, спешу. Увидимся!"}
          - {who: they, sr: "Prijatno!", tr: "Всего доброго!"}
      - id: komsije-2
        title: "Как прошли выходные"
        lines:
          - {who: they, sr: "Šta ste radili za vikend?", tr: "Что делали на выходных?"}
          - {who: me, sr: "Bili smo na Adi i šetali smo pored reke.", tr: "Были на Аде, гуляли у реки."}
          - {who: they, sr: "Lepo! Vreme je bilo divno.", tr: "Здорово! Погода была чудесная."}
          - {who: me, sr: "Jeste. A vi?", tr: "Да. А вы?"}
          - {who: they, sr: "Bio sam kod ćerke u Novom Sadu.", tr: "Я был у дочери в Нови-Саде."}
      - id: komsije-3
        title: "Посылка у соседа"
        lines:
          - {who: they, sr: "Izvinite, kurir je ostavio vaš paket kod mene.", tr: "Извините, курьер оставил вашу посылку у меня."}
          - {who: me, sr: "Hvala vam puno! Mogu li sada da ga uzmem?", tr: "Большое спасибо! Могу забрать её сейчас?"}
          - {who: they, sr: "Naravno, izvolite.", tr: "Конечно, пожалуйста."}
          - {who: me, sr: "Hvala, mnogo ste ljubazni.", tr: "Спасибо, вы очень любезны."}
          - {who: they, sr: "Nema na čemu. Ako vam nešto treba, tu sam na drugom spratu.", tr: "Не за что. Если что-то нужно — я на втором этаже."}

  - id: prodavnica
    title: "Магазин"
    title_sr: "Prodavnica"
    pri: 1
    dialogs:
      - id: prodavnica-1
        title: "На кассе"
        lines:
          - {who: they, sr: "Dobar dan. Treba li vam kesa?", tr: "Добрый день. Пакет нужен?"}
          - {who: me, sr: "Da, jedna, molim. Može karticom?", tr: "Да, один, пожалуйста. Можно картой?"}
          - {who: they, sr: "Može. Imate li karticu lojalnosti?", tr: "Можно. У вас есть карта лояльности?"}
          - {who: me, sr: "Nemam.", tr: "Нет."}
          - {who: they, sr: "Treba li vam račun?", tr: "Чек нужен?"}
          - {who: me, sr: "Ne treba, hvala. Prijatno!", tr: "Не нужен, спасибо. Всего доброго!"}
      - id: prodavnica-2
        title: "Ищу товар"
        lines:
          - {who: me, sr: "Izvinite, gde mogu da nađem hleb i mleko?", tr: "Извините, где можно найти хлеб и молоко?"}
          - {who: they, sr: "Hleb je kod kase, a mleko je levo, u frižideru.", tr: "Хлеб у кассы, а молоко слева, в холодильнике."}
          - {who: me, sr: "Da li imate jogurt bez laktoze?", tr: "У вас есть йогурт без лактозы?"}
          - {who: they, sr: "Nemamo, nažalost. Probajte sutra.", tr: "К сожалению, нет. Попробуйте завтра."}
      - id: prodavnica-3
        title: "У прилавка на развес"
        lines:
          - {who: they, sr: "Izvolite, šta želite?", tr: "Пожалуйста, что желаете?"}
          - {who: me, sr: "Dajte mi pola kile sira i dvesta grama šunke.", tr: "Дайте мне полкило сыра и двести граммов ветчины."}
          - {who: they, sr: "Može malo više?", tr: "Можно чуть больше?"}
          - {who: me, sr: "Može. Koliko je to?", tr: "Можно. Сколько это?"}
          - {who: they, sr: "Osamsto pedeset dinara.", tr: "Восемьсот пятьдесят динаров."}

  - id: mup
    title: "МУП: ВНЖ, ПМЖ, справки"
    title_sr: "MUP: boravak i potvrde"
    pri: 1
    dialogs:
      - id: mup-1
        title: "Подаю на ВНЖ"
        lines:
          - {who: they, sr: "Sledeći! Izvolite.", tr: "Следующий! Прошу."}
          - {who: me, sr: "Dobar dan. Želim da predam zahtev za privremeni boravak.", tr: "Добрый день. Хочу подать заявление на временное пребывание (ВНЖ)."}
          - {who: they, sr: "Da li imate zakazan termin?", tr: "Вы записаны?"}
          - {who: me, sr: "Da, u deset i trideset. Evo pasoša.", tr: "Да, на десять тридцать. Вот паспорт."}
          - {who: they, sr: "Treba mi još dokaz o smeštaju i polisa zdravstvenog osiguranja.", tr: "Мне ещё нужны подтверждение жилья и полис медицинской страховки."}
          - {who: me, sr: "Evo ugovora o zakupu. Da li mora da bude overen?", tr: "Вот договор аренды. Он должен быть заверен?"}
          - {who: they, sr: "Da, ugovor mora da bude overen kod notara.", tr: "Да, договор должен быть заверен у нотариуса."}
      - id: mup-2
        title: "Пошлина и сроки"
        lines:
          - {who: they, sr: "Morate da platite taksu. Ovo je uplatnica.", tr: "Нужно оплатить пошлину. Вот квитанция."}
          - {who: me, sr: "Gde mogu da platim?", tr: "Где можно оплатить?"}
          - {who: they, sr: "U pošti ili u banci. Donesite potvrdu o uplati.", tr: "На почте или в банке. Принесите подтверждение оплаты."}
          - {who: me, sr: "Koliko traje postupak?", tr: "Сколько длится процедура?"}
          - {who: they, sr: "Rešenje dobijate za otprilike mesec dana.", tr: "Решение получите примерно через месяц."}
      - id: mup-3
        title: "ПМЖ и справка о регистрации"
        lines:
          - {who: me, sr: "Koja dokumenta su potrebna za stalno nastanjenje?", tr: "Какие документы нужны для ПМЖ (постоянного проживания)?"}
          - {who: they, sr: "Morate da imate tri godine privremenog boravka bez prekida.", tr: "Нужно три года ВНЖ без перерыва."}
          - {who: me, sr: "Treba mi i potvrda o prijavi adrese. Gde mogu da je dobijem?", tr: "Мне нужна ещё справка о регистрации адреса. Где её получить?"}
          - {who: they, sr: "Na šalteru broj pet. Ponesite ličnu kartu za strance.", tr: "В окне номер пять. Возьмите удостоверение личности иностранца."}
          - {who: me, sr: "Izvinite, možete li da ponovite sporije?", tr: "Извините, можете повторить медленнее?"}

  - id: notar
    title: "Нотариус, юрист, бухгалтер"
    title_sr: "Javni beležnik, advokat, knjigovođa"
    pri: 2
    dialogs:
      - id: notar-1
        title: "Доверенность у нотариуса"
        lines:
          - {who: they, sr: "Dobar dan, izvolite.", tr: "Добрый день, слушаю вас."}
          - {who: me, sr: "Treba mi punomoćje za suprugu, da može da preda dokumenta umesto mene.", tr: "Мне нужна доверенность на жену, чтобы она могла подать документы вместо меня."}
          - {who: they, sr: "Da li imate tekst punomoćja?", tr: "У вас есть текст доверенности?"}
          - {who: me, sr: "Nemam. Možete li vi da ga sastavite?", tr: "Нет. Вы можете его составить?"}
          - {who: they, sr: "Mogu. Treba mi vaš pasoš i njeni podaci.", tr: "Могу. Мне нужен ваш паспорт и её данные."}
          - {who: me, sr: "U redu. Koliko košta overa?", tr: "Хорошо. Сколько стоит заверение?"}
      - id: notar-2
        title: "Перевод и заверение документа"
        lines:
          - {who: me, sr: "Treba mi prevod izvoda iz matične knjige rođenih na srpski.", tr: "Мне нужен перевод свидетельства о рождении на сербский."}
          - {who: they, sr: "Prevod radi sudski tumač. Da li dokument ima apostil?", tr: "Перевод делает судебный переводчик. На документе есть апостиль?"}
          - {who: me, sr: "Ima. Koliko traje prevod?", tr: "Есть. Сколько делается перевод?"}
          - {who: they, sr: "Dva-tri dana. Donesite original i jednu kopiju.", tr: "Два-три дня. Принесите оригинал и одну копию."}
          - {who: me, sr: "Da li treba i overa kopije?", tr: "Нужно ли ещё заверить копию?"}
          - {who: they, sr: "Da, kopiju overava javni beležnik.", tr: "Да, копию заверяет нотариус."}
      - id: notar-3
        title: "Бухгалтер для ИП"
        lines:
          - {who: me, sr: "Dobar dan. Otvorio sam firmu i treba mi knjigovođa.", tr: "Добрый день. Я открыл фирму (ИП), мне нужен бухгалтер."}
          - {who: they, sr: "Čime se bavite? Da li ste paušalac?", tr: "Чем занимаетесь? Вы на паушальном налоге?"}
          - {who: me, sr: "Da. Koliko koštaju vaše usluge mesečno?", tr: "Да. Сколько стоят ваши услуги в месяц?"}
          - {who: they, sr: "Zavisi od posla. Porez se plaća do petnaestog u mesecu.", tr: "Зависит от объёма работы. Налог платится до пятнадцатого числа."}
          - {who: me, sr: "Šta treba da vam pošaljem?", tr: "Что мне вам прислать?"}
          - {who: they, sr: "Ugovore, račune i izvode iz banke.", tr: "Договоры, счета и банковские выписки."}
          - {who: me, sr: "Da li mogu da se posavetujem i sa advokatom?", tr: "Могу ли я ещё проконсультироваться с юристом?"}

  - id: kolega
    title: "Дружеская беседа с коллегой"
    title_sr: "Razgovor sa kolegom"
    pri: 1
    dialogs:
      - id: kolega-1
        title: "Перерыв на кофе"
        lines:
          - {who: they, sr: "Ćao! Hoćeš na kafu?", tr: "Привет! Пойдём на кофе?"}
          - {who: me, sr: "Može! Imam pauzu pola sata.", tr: "Давай! У меня перерыв полчаса."}
          - {who: they, sr: "Kako ti je bio vikend?", tr: "Как прошли выходные?"}
          - {who: me, sr: "Odlično. Bili smo na planini. A tvoj?", tr: "Отлично. Были в горах. А твои?"}
          - {who: they, sr: "Ništa posebno, odmarao sam kod kuće.", tr: "Ничего особенного, отдыхал дома."}
      - id: kolega-2
        title: "Как тебе Белград"
        lines:
          - {who: they, sr: "Kako ti se sviđa Beograd?", tr: "Как тебе Белград?"}
          - {who: me, sr: "Mnogo mi se sviđa. Ljudi su jako ljubazni.", tr: "Очень нравится. Люди очень приветливые."}
          - {who: they, sr: "Da li ti je teško sa jezikom?", tr: "Тебе трудно с языком?"}
          - {who: me, sr: "Malo. Razumem više nego što mogu da kažem.", tr: "Немного. Понимаю больше, чем могу сказать."}
          - {who: they, sr: "Ne brini, ide ti odlično!", tr: "Не переживай, у тебя отлично получается!"}
      - id: kolega-3
        title: "Планы после работы"
        lines:
          - {who: they, sr: "Šta radiš posle posla?", tr: "Что делаешь после работы?"}
          - {who: me, sr: "Nemam planove. Imaš neki predlog?", tr: "Планов нет. Есть предложение?"}
          - {who: they, sr: "Idemo na pivo sa ekipom u sedam.", tr: "Идём на пиво с компанией в семь."}
          - {who: me, sr: "Super, dolazim! Pošalji mi adresu.", tr: "Супер, приду! Пришли адрес."}

  - id: igraliste
    title: "Детская площадка"
    title_sr: "Na igralištu"
    pri: 1
    dialogs:
      - id: igraliste-1
        title: "Знакомство с мамой"
        lines:
          - {who: they, sr: "Ćao! Kako se zove vaš sin?", tr: "Привет! Как зовут вашего сына?"}
          - {who: me, sr: "Zove se Miša. A vaša ćerka?", tr: "Его зовут Миша. А вашу дочку?"}
          - {who: they, sr: "Ana. Koliko ima godina?", tr: "Ана. Сколько ему лет?"}
          - {who: me, sr: "Tri godine. A ona?", tr: "Три года. А ей?"}
          - {who: they, sr: "I ona ima tri! Mogu da se igraju zajedno.", tr: "Ей тоже три! Могут поиграть вместе."}
      - id: igraliste-2
        title: "Качели и очередь"
        lines:
          - {who: they, sr: "Izvinite, da li je ljuljaška slobodna?", tr: "Извините, качели свободны?"}
          - {who: me, sr: "Još malo pa je vaš red.", tr: "Ещё чуть-чуть, и ваша очередь."}
          - {who: me, sr: "Miša, hajde, sada ide devojčica.", tr: "Миша, давай, теперь девочка."}
          - {who: they, sr: "Hvala, baš ste ljubazni.", tr: "Спасибо, вы очень любезны."}
      - id: igraliste-3
        title: "Игрушки и садик"
        lines:
          - {who: they, sr: "Je l' ovo vaša lopta?", tr: "Это ваш мяч?"}
          - {who: me, sr: "Da, ali mogu da se igraju njom. Nema problema.", tr: "Да, но они могут ею поиграть. Без проблем."}
          - {who: they, sr: "Da li ide u vrtić?", tr: "Он ходит в садик?"}
          - {who: me, sr: "Da, u vrtić pored parka.", tr: "Да, в садик возле парка."}
          - {who: me, sr: "Pažljivo, nemoj da padneš!", tr: "Осторожно, не упади!"}

  - id: pekara
    title: "Булочная"
    title_sr: "U pekari"
    pri: 1
    dialogs:
      - id: pekara-1
        title: "Хлеб и бурек"
        lines:
          - {who: they, sr: "Izvolite, šta želite?", tr: "Пожалуйста, что желаете?"}
          - {who: me, sr: "Jedan beli hleb i dva bureka sa sirom.", tr: "Один белый хлеб и два бурека с сыром."}
          - {who: they, sr: "Da vam isečem hleb?", tr: "Нарезать вам хлеб?"}
          - {who: me, sr: "Da, molim vas.", tr: "Да, пожалуйста."}
          - {who: they, sr: "Za poneti ili ovde?", tr: "С собой или здесь?"}
          - {who: me, sr: "Za poneti.", tr: "С собой."}
      - id: pekara-2
        title: "Что свежее"
        lines:
          - {who: me, sr: "Da li je ovo sveže?", tr: "Это свежее?"}
          - {who: they, sr: "Jeste, još je toplo.", tr: "Да, ещё тёплое."}
          - {who: me, sr: "Dajte mi četiri kifle i jedan jogurt.", tr: "Дайте мне четыре рогалика и один йогурт."}
          - {who: they, sr: "Nešto slatko? Imamo pitu sa jabukama.", tr: "Что-нибудь сладкое? Есть пирог с яблоками."}
          - {who: me, sr: "Može jedno parče.", tr: "Давайте один кусок."}
      - id: pekara-3
        title: "Нет нужного"
        lines:
          - {who: me, sr: "Imate li integralni hleb?", tr: "Есть цельнозерновой хлеб?"}
          - {who: they, sr: "Nažalost, nestalo je. Biće ponovo posle podne.", tr: "К сожалению, закончился. Будет снова после обеда."}
          - {who: me, sr: "Onda pola crnog hleba.", tr: "Тогда половину чёрного хлеба."}
          - {who: they, sr: "Još nešto?", tr: "Что-нибудь ещё?"}
          - {who: me, sr: "Ne, to je sve. Hvala!", tr: "Нет, это всё. Спасибо!"}

  - id: lekar
    title: "У врача"
    title_sr: "Kod lekara"
    pri: 1
    dialogs:
      - id: lekar-1
        title: "Запись в дом здравља"
        lines:
          - {who: me, sr: "Dobar dan, želim da zakažem pregled kod lekara.", tr: "Добрый день, хочу записаться на приём к врачу."}
          - {who: they, sr: "Imate li zdravstvenu karticu?", tr: "У вас есть медицинская карточка (страховки)?"}
          - {who: me, sr: "Imam. Kada ima slobodan termin?", tr: "Есть. Когда есть свободное время?"}
          - {who: they, sr: "Sutra u devet. Dođite petnaest minuta ranije.", tr: "Завтра в девять. Приходите на пятнадцать минут раньше."}
      - id: lekar-2
        title: "Что болит"
        lines:
          - {who: they, sr: "Šta vas boli?", tr: "Что у вас болит?"}
          - {who: me, sr: "Boli me grlo i imam temperaturu.", tr: "Болит горло и у меня температура."}
          - {who: they, sr: "Od kada?", tr: "С какого времени?"}
          - {who: me, sr: "Od juče. Osećam se loše.", tr: "Со вчера. Чувствую себя плохо."}
          - {who: they, sr: "Da li ste alergični na neki lek?", tr: "У вас есть аллергия на какое-нибудь лекарство?"}
          - {who: me, sr: "Nisam.", tr: "Нет."}
      - id: lekar-3
        title: "Рецепт"
        lines:
          - {who: they, sr: "Dobićete recept. Uzimajte lek tri puta dnevno posle jela.", tr: "Получите рецепт. Принимайте лекарство три раза в день после еды."}
          - {who: me, sr: "Gde mogu da kupim lek?", tr: "Где можно купить лекарство?"}
          - {who: they, sr: "U apoteci. Ako ne bude bolje, dođite ponovo.", tr: "В аптеке. Если не станет лучше, приходите снова."}
          - {who: me, sr: "Hvala, doktore.", tr: "Спасибо, доктор."}

# ---------- слова ----------
# core: общее ядро (sit не указан — ситуации проставятся сами по диалогам)
words:
  # люди и указатели
  - {tier: 1, sr: ja, tr: "я (мне — mi, meni; меня — me, mene)"}
  - {tier: 1, sr: ti, tr: "ты (тебе — ti, tebi)", note: "С коллегами и друзьями — на «ti», с соседями старшего возраста и в учреждениях — на «Vi»."}
  - {tier: 1, sr: vi, tr: "вы (вам — vam; вас — vas)", note: "В письмах и учреждениях вежливое «Vi» пишется с большой буквы."}
  - {tier: 1, sr: mi, tr: "мы"}
  - {tier: 1, sr: "on", tr: "он (его — ga, njega; ему — mu)"}
