# Core Serbian lexicon (ekavian, Latin) — the top of spoken frequency, where open lexicons are thin.
# UniMorph (Wiktionary) has no biti, imati, znati, moći, ići, ja, moj, ovaj… — exactly the words a
# beginner meets first. sr_lemma.py reads this file BEFORE UniMorph; on a clash the entry listed
# earlier wins (closed class and adverbs → verbs → nouns → adjectives).
#
# Fields: l lemma · pos · ru translation (used when the explanation language is Russian) ·
#   f  forms (space-separated, the lemma itself is implied) · asp ipf|pf · pair aspect partner ·
#   g  gender for nouns (m f n; mp fp np for plural-only) · pl plural nominative · st oblique stem ·
#   cmp comparative (adjectives) · gen false = no generated forms, only `f`.
# Nouns and adjectives get their regular forms generated (sr_lemma.py, paradigm); `f` adds or
# overrides irregular ones. Forms shared by two lemmas are listed under the more frequent one only.
version: 1

