# What's new per version. The upgrade module reads entries newer than the folder's plugin_version.
# actions: what the upgrade does after migrating (rebuild, new cards, …).
- version: "0.3.0"
  date: "2026-10-03"
  data_version: 1
  notes:
    ru:
      - "Телефон: вкладки отдельной строкой с прокруткой, неделя целиком в одну строку."
      - "Варианты ответа без примеров в скобках — короче и не подсказывают ответ."
      - "Набор «Белград»: добавлены детская площадка, булочная и врач."
      - "Публичный сайт (site.py → GitHub Pages): слова и прогресс в вашем закрытом репозитории на GitHub, общие для всех устройств; иконка на экране «Домой»."
      - "Ревью 80/20: 270 слов в трёх уровнях важности (база → ключевые для ситуаций → полезные), учатся по важности, а не по темам; 50 узких слов убраны (прогресс по ним сохраняется)."
    en:
      - "Phone layout: tabs on their own scrollable row, the week fits on one line."
      - "Answer choices drop the bracketed examples — shorter, and they no longer give the answer away."
      - "Pack «Belgrade»: playground, bakery and doctor added."
      - "Public site (site.py → GitHub Pages): words and progress in your private GitHub repository, shared by all your devices; a home-screen icon."
      - "80/20 review: 270 words in three tiers (base → key for the situations → useful), learned by importance, not by topic; 50 narrow words removed (their progress is kept)."
  actions: [rebuild]
- version: "0.2.0"
  date: "2026-10-03"
  data_version: 1
  notes:
    ru:
      - "Набор «Белград: первые разговоры»: соседи в подъезде, магазин, МУП (ВНЖ, ПМЖ, справки), нотариус/юрист/бухгалтер (доверенности, переводы, заверения), дружеская беседа с коллегой — 15 диалогов, ~250 слов, ~90 фраз, карточки на падежи."
      - "Слова набора покрывают ~94% слов в его диалогах; ядро — самые частые слова, дальше слова ситуаций."
      - "Примеры и привязка к ситуациям проставляются из диалогов автоматически; слова важных ситуаций не уходят в хвост колоды."
    en:
      - "Pack «Belgrade: first conversations»: neighbours, shop, MUP (temporary/permanent residence, certificates), notary/lawyer/accountant, a friendly chat with a colleague — 15 dialogs, ~250 words, ~90 phrases, case cards."
      - "The pack's words cover ~94% of the words in its dialogs."
      - "Examples and situation tags come from the dialogs automatically; words of important situations no longer sink to the deck's tail."
  actions: [rebuild]
