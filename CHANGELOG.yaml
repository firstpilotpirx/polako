      - "Первая версия: персональный словарь из частотности разговорного сербского, ваших ситуаций и ваших текстов."
      - "Тренажёр FSRS: узнавание → вспоминание, карточки на слух, фразы, падежи, вид глагола, ответы в диалогах."
